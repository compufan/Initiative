[package]
name = "initiative-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Initiative – modulare Plattform-API (Messenger, Kalender, Umfragen, Spiele)"
license = "MIT"
publish = false

[[bin]]
name = "initiative-api"
path = "src/main.rs"

[profile.release]
# Kleine Binary ohne Debug-Symbole; die Migrationen stecken bereits darin.
strip = true
opt-level = 3

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
elliptic-curve = { version = "0.13.8", features = ["sec1"] }
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
mime_guess = "2.0.5"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "pkcs8"] }
rand = "0.9.5"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "http2", "charset"] }
rusty-s3 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.20.0", features = ["v7", "serde"] }

[dev-dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
http-body-util = "0.1.5"
urlencoding = "2.1.3"
