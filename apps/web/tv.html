<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Das Blatt für den Fernseher.

      Ein EIGENER Einstiegspunkt und nicht eine Seite der App. Der Grund ist
      der Browser am anderen Ende: In einem Fernseher steckt selten ein
      aktueller. Die App zieht React, den Wegweiser und die Freistell-Bausteine
      mit sich; hier lädt ein Blatt von wenigen Kilobyte, das keine einzige
      fremde Bibliothek braucht.

      Dazu kommt: Diese Seite läuft OHNE Anmeldung. In der App liegt alles
      hinter dem Anmeldeschirm, und das soll auch so bleiben.
    -->
    <title>Fernseher – Initiative</title>
    <link rel="stylesheet" href="/src/tv/tv.css" />
  </head>
  <body>
    <main id="blatt" class="warten">
      <section id="anmeldung" class="mitte">
        <!--
          Das Zeichen der Gruppe, bevor irgendetwas läuft.

          Der Fernseher steht im Wohnzimmer, und zwischen dem Einschalten und
          dem ersten Foto vergeht die Zeit, die jemand braucht, um das Telefon
          zu holen und acht Zeichen abzutippen. In dieser Zeit stand hier
          schwarze Fläche mit einem Code. Jetzt steht dort, wem der Abend
          gehört.

          `eager` und `fetchpriority`: Es ist das Erste, was zu sehen sein
          soll, nicht das Letzte, was nachgeladen wird.
        -->
        <img
          class="marke"
          src="/marke/logo@2x.webp"
          alt="Initiative Wir für Bier"
          loading="eager"
          fetchpriority="high"
          decoding="sync"
        />
        <p class="klein">Diashow und Videos aus deinen Sammlungen</p>
        <h1 id="code" class="code">…</h1>
        <p class="anweisung">
          Öffne die App auf dem Telefon, öffne ein Foto oder eine Sammlung, tippe auf
          <strong>Code am Fernseher</strong> und gib diesen Code ein.
        </p>
        <p id="fehler" class="fehler" hidden></p>
      </section>

      <!--
        Der Chat als dritter Abschnitt – nicht in der Bühne.

        Die Bühne ist schwarz und randlos gebaut: zwei Bilder übereinander,
        `object-fit: contain`, kein Platz für irgendetwas daneben. Ein
        Gesprächsverlauf braucht das Gegenteil – Ränder, Zeilen, einen Kopf
        mit dem Namen. Zwei Abschnitte, von denen immer genau einer sichtbar
        ist, sind ehrlicher als ein Abschnitt, der zwei Dinge kann.
      -->
      <section id="verlauf" class="verlauf" hidden>
        <header class="verlauf-kopf">
          <img class="verlauf-marke" src="/marke/logo@2x.webp" alt="" aria-hidden="true" />
          <h2 id="verlauf-titel" class="verlauf-titel"></h2>
          <span id="verlauf-seite" class="verlauf-seite"></span>
        </header>
        <ol id="verlauf-liste" class="verlauf-liste"></ol>
      </section>

      <section id="buehne" class="buehne" hidden>
        <img id="bildA" class="bild" alt="" />
        <img id="bildB" class="bild" alt="" />
        <video id="film" class="film" playsinline hidden></video>
        <div id="hinweis" class="hinweis" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/tv/tv.ts"></script>
  </body>
</html>
