name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: initiative_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Format
        run: cargo fmt --manifest-path apps/api/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/initiative_test
          DATABASE_SSL: "false"
        run: cargo test --manifest-path apps/api/Cargo.toml

  web:
    name: PWA (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @initiative/web build

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: initiative
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/initiative
      JWT_SECRET: ci-secret-value-at-least-16-characters
      PUBLIC_API_URL: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:5173
      STORAGE_DRIVER: local
      REALTIME_BUS: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Die API einmal vorbauen, damit der Playwright-Start nicht in den Timeout läuft.
      - run: cargo build --manifest-path apps/api/Cargo.toml --bin initiative-api
      - run: pnpm --filter @initiative/web exec playwright install --with-deps chromium
      - run: pnpm --filter @initiative/web exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  image:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Baut genau das Image, das spaeter auf Fly.io landet. Ohne diesen
      # Schritt faellt ein Fehler in der Build-Umgebung (fehlende
      # Systembibliothek, kaputtes Dockerfile) erst beim Deploy auf – und
      # dann steht die Live-App.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: initiative-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Beweist, dass die Binary wirklich startet: Ohne Datenbank muss sie
      # sich mit einer klaren Meldung beenden, nicht stumm mit Code 0.
      - name: Binary startet und meldet sich
        run: |
          set -o pipefail
          output=$(docker run --rm initiative-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "DATABASE_URL" \
            || { echo "Die Binary hat sich nicht wie erwartet gemeldet."; exit 1; }
