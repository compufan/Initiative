# Fernbedienung für die API – bedienbar vom Handy.
#
# Gedacht für den Fall, dass man unterwegs ist und keinen Rechner hat:
# GitHub-App öffnen (oder github.com im Browser) → Actions → „API-Wartung“ →
# „Run workflow“ → Aufgabe wählen → starten. Das ersetzt `flyctl` auf dem
# eigenen Rechner für genau die Handgriffe, die im Betrieb wirklich anfallen.
#
# Braucht dasselbe FLY_API_TOKEN wie der Deploy-Ablauf.

name: API-Wartung

on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: "Was soll passieren?"
        required: true
        default: neustart
        type: choice
        options:
          - zustand
          - neustart
          - starten
          - protokoll
          - secret-setzen
          - migration-reparieren
          - neu-anlegen
      # „migration-reparieren“ löst die Blockade, die am 25. August einen
      # halben Tag Ausfall verursacht hat: Eine Migrationsdatei war nach dem
      # Ausführen verändert worden, sqlx verweigerte daraufhin JEDE Migration
      # („VersionMismatch“), der Prozess beendete sich, Fly startete ihn neu –
      # zehnmal, dann gar nicht mehr. Diese Aufgabe gleicht die Prüfsumme an,
      # lässt die offenen Migrationen durchlaufen und räumt den Schalter danach
      # wieder weg. Ein Knopfdruck, kein Rechner nötig.
      #
      # „neu-anlegen“ ist der Notnagel: eine festgefahrene Maschine wird
      # weggeworfen und aus dem Abbild neu erzeugt. Daten gehen dabei keine
      # verloren – die liegen in der Datenbank und im Objektspeicher, nicht
      # auf der Maschine.
      secret_name:
        description: "Nur bei „secret-setzen“: Name, z. B. S3_BUCKET"
        required: false
        type: string
      secret_wert:
        description: "Nur bei „secret-setzen“: Wert, z. B. initiative"
        required: false
        type: string

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  FLY_APP: initiative-api
  API_URL: https://initiative-api.fly.dev

jobs:
  wartung:
    name: ${{ inputs.aufgabe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auf hinterlegtes Token prüfen
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error::FLY_API_TOKEN ist nicht hinterlegt."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Zustand vorher
        run: |
          set -uo pipefail
          echo "## Maschinen" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          flyctl machines list --app "$FLY_APP" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Antwortet die App?" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -s -m 15 -w '\nHTTP %{http_code} nach %{time_total}s\n' "$API_URL/healthz" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "keine Antwort" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Secret setzen
        if: inputs.aufgabe == 'secret-setzen'
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.secret_name }}" ] || [ -z "${{ inputs.secret_wert }}" ]; then
            echo "::error::Name und Wert werden beide gebraucht."
            exit 1
          fi
          # `--stage` setzt es, ohne sofort neu zu starten. Der Neustart kommt
          # gleich darunter kontrolliert – sonst laufen zwei Vorgaenge gegen-
          # einander und die Maschine bleibt womoeglich wieder stehen.
          flyctl secrets set --app "$FLY_APP" --stage \
            "${{ inputs.secret_name }}=${{ inputs.secret_wert }}"
          echo "Gesetzt: ${{ inputs.secret_name }} (Wert wird nicht angezeigt)" >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Zwei Neustarts in einem Griff: Schalter an, Migrationen laufen lassen,
      # Schalter wieder aus. Der Schalter bleibt bewusst nicht stehen – er
      # würde sonst jede künftige Änderung an einer bereits ausgeführten
      # Migration stillschweigend durchwinken, statt sie zu melden.
      - name: Migration reparieren
        if: inputs.aufgabe == 'migration-reparieren'
        run: |
          set -euo pipefail

          warten() {
            for versuch in $(seq 1 24); do
              code=$(curl -s -o antwort.json -w '%{http_code}' -m 6 "$API_URL/healthz" || echo 000)
              if [ "$code" = "200" ]; then
                echo "  … antwortet: $(cat antwort.json)"
                return 0
              fi
              echo "  Versuch $versuch: HTTP $code"
              sleep 5
            done
            echo "  keine gesunde Antwort nach rund zwei Minuten"
            [ -s antwort.json ] && cat antwort.json
            return 1
          }

          echo "1/3 Schalter setzen (die Maschine startet dabei neu) …"
          flyctl secrets set --app "$FLY_APP" MIGRATIONS_REPAIR=1

          echo "2/3 Warten, bis die Migrationen durch sind …"
          if ! warten; then
            echo "::error::Die App wurde nach dem Reparaturlauf nicht gesund. Schalter wird trotzdem entfernt."
            flyctl secrets unset --app "$FLY_APP" MIGRATIONS_REPAIR || true
            exit 1
          fi

          echo "3/3 Schalter wieder entfernen …"
          flyctl secrets unset --app "$FLY_APP" MIGRATIONS_REPAIR

          {
            echo "### Migrationen repariert"
            echo "Was genau angeglichen wurde, steht im Protokoll –"
            echo "Aufgabe „protokoll“ ausführen und nach „Prüfsumme“ suchen."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Neu starten
        if: inputs.aufgabe == 'neustart' || inputs.aufgabe == 'secret-setzen'
        run: |
          set -euo pipefail
          flyctl machines list --app "$FLY_APP" --json > maschinen.json
          for id in $(jq -r '.[].id' maschinen.json); do
            echo "Starte $id neu …"
            flyctl machines restart "$id" --app "$FLY_APP"
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Starten
        if: inputs.aufgabe == 'starten'
        run: |
          set -euo pipefail
          flyctl machines list --app "$FLY_APP" --json > maschinen.json
          gestoppt=$(jq -r '.[] | select(.state != "started") | .id' maschinen.json)
          if [ -z "$gestoppt" ]; then
            echo "Alle Maschinen laufen bereits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for id in $gestoppt; do
            echo "Starte $id …"
            flyctl machines start "$id" --app "$FLY_APP"
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Der Notnagel. Anlass war eine Maschine, die sich nicht mehr starten
      # liess: Der Fly-Vermittler versuchte es bei jeder eingehenden Anfrage
      # erneut, lief dabei in die Drosselung der Machines-API („rate limit
      # exceeded“), und damit kam auch `fly deploy` nicht mehr durch. Aus
      # dieser Schleife kommt man am sichersten heraus, indem man die
      # Maschine wegwirft und eine neue erzeugen laesst.
      - name: Maschine neu anlegen
        if: inputs.aufgabe == 'neu-anlegen'
        run: |
          set -euo pipefail
          flyctl machines list --app "$FLY_APP" --json > maschinen.json
          jq -r '.[] | "  \(.id)  \(.state)"' maschinen.json
          for id in $(jq -r '.[].id' maschinen.json); do
            echo "Werfe $id weg …"
            flyctl machines destroy "$id" --app "$FLY_APP" --force
          done
          echo "Lege aus dem Abbild neu an …"
          flyctl deploy apps/api --app "$FLY_APP" --remote-only \
            --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Nach jedem Eingriff nachsehen, ob die App wirklich antwortet – sonst
      # meldet auch dieser Ablauf faelschlich Erfolg.
      - name: Antwortet die App?
        if: inputs.aufgabe != 'protokoll' && inputs.aufgabe != 'zustand'
             && inputs.aufgabe != 'migration-reparieren'
        run: |
          set -uo pipefail
          # Bewusst kurz und wenige Versuche. Eine haengende Fly-App bringt
          # den Vermittler dazu, bei JEDER Anfrage einen Maschinenstart zu
          # versuchen; zu langes Anklopfen treibt ihn in die Drosselung der
          # Machines-API und macht die Lage schlimmer statt besser.
          letzter=000
          for versuch in $(seq 1 12); do
            code=$(curl -s -o antwort.json -w '%{http_code}' -m 6 "$API_URL/healthz" || echo 000)
            letzter=$code
            if [ "$code" = "200" ]; then
              echo "Die App antwortet:"
              cat antwort.json
              {
                echo "### API ist oben"
                echo '```json'
                cat antwort.json
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Ein Fehlercode ist eine ANTWORT – und die App sagt darin, was ihr
            # fehlt. Das ist etwas ganz anderes als Funkstille, und der
            # Unterschied gehoert in den Bericht, statt unter „antwortet nicht“
            # zu verschwinden.
            if [ "$code" != "000" ] && [ -s antwort.json ]; then
              echo "Die App antwortet mit HTTP $code:"
              cat antwort.json
            fi
            echo "Versuch $versuch: HTTP $code – warte 5 s"
            sleep 5
          done
          if [ "$letzter" != "000" ] && [ -s antwort.json ]; then
            {
              echo "### API laeuft, ist aber nicht gesund (HTTP $letzter)"
              echo '```json'
              cat antwort.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Die API laeuft, meldet aber ein Problem (HTTP $letzter) – siehe Zusammenfassung."
          else
            echo "::error::Die API antwortet ueberhaupt nicht (12 Versuche, rund zwei Minuten)."
          fi
          exit 1

      - name: Protokoll
        if: inputs.aufgabe == 'protokoll' || failure()
        run: |
          set -uo pipefail
          echo "## Protokoll" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          timeout 60 flyctl logs --app "$FLY_APP" --no-tail 2>&1 \
            | tail -200 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
