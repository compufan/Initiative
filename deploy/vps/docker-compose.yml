# Der Stapel auf dem eigenen Server.
#
# Anders als die `docker-compose.yml` im Wurzelverzeichnis baut diese hier
# nichts: Sie holt fertige Abbilder aus der GitHub-Registry. Das ist kein
# Geschmack, sondern Notwendigkeit – ein Rust-Release-Build braucht mehrere
# Gigabyte Arbeitsspeicher und Minuten an Rechenzeit. Auf einer Maschine, auf
# der gleichzeitig Postgres und die laufende App liegen, ist das kein
# Bauvorgang, sondern ein Ausfall.
#
#   cp .env.beispiel .env   # Werte eintragen
#   ./deploy.sh <git-sha>
#
# Zum Zurückrollen: dasselbe mit der Kennung von gestern.

# Gilt fuer jeden Dienst. `no-new-privileges` verhindert, dass ein Prozess im
# Container ueber ein setuid-Programm mehr Rechte bekommt, als er gestartet hat
# - der uebliche zweite Schritt nach einer Luecke im Dienst selbst. Kostet
# nichts und bricht hier nichts.
x-haerten: &haerten
  security_opt:
    - no-new-privileges:true

x-logs: &logs
  logging:
    driver: json-file
    options:
      # Der Standardtreiber rotiert NICHT. Ein gesprächiger Dienst füllt über
      # Monate still die Platte, und ein volles /var legt Postgres lahm – die
      # häufigste Ursache für „der Server ist plötzlich tot".
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: [*logs, *haerten]
    # Absichtlich KEIN `cap_drop: [ALL]`: Der Einstiegspunkt des offiziellen
    # Abbilds richtet beim ersten Start das Datenverzeichnis ein (chown, chmod)
    # und wechselt dann auf den Benutzer postgres. Ohne CHOWN/FOWNER/SETUID
    # scheitert genau das - und zwar beim allerersten Start, wenn man am
    # wenigsten Lust auf Fehlersuche hat.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-initiative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-initiative}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # KEIN ports:-Eintrag. Docker schreibt eigene iptables-Regeln und umgeht
    # damit ufw – eine offene 5432 wäre aus dem Internet erreichbar, obwohl die
    # Firewall sie scheinbar sperrt. Wer von aussen an die Datenbank will,
    # tunnelt: ssh -L 5432:localhost:5432 und dann `docker compose exec`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-initiative}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-compufan}/initiative-api:${IMAGE_TAG:-live}
    restart: unless-stopped
    <<: [*logs, *haerten]
    # Der Dienst laeuft ohnehin als eigener Benutzer (uid 10001) und lauscht auf
    # 8080 - er braucht keine einzige Sonderberechtigung.
    cap_drop:
      - ALL
    # Das Dateisystem des Containers ist schreibgeschuetzt. Wer es doch einmal
    # bis in den Prozess schafft, kann damit nichts Bleibendes ablegen: kein
    # nachgeladenes Programm, kein Hintertuerchen, das den Neustart ueberlebt.
    # Geschrieben wird nur in /data/uploads (ein Volume) und nach /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      # Beide ausdrücklich hier und nicht nur in der .env: Ohne sie fällt die
      # API still auf localhost zurück und startet fehlerfrei – danach sind
      # alle Bilder unsichtbar (jede Medienadresse wird daraus gebaut), die
      # Passkeys unbrauchbar (die Kennung kommt aus dem Hostnamen) und der
      # Kalenderfeed falsch. Ein Fehlstart ist besser als das.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?fehlt}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?fehlt}
      DATABASE_URL: postgres://${POSTGRES_USER:-initiative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-initiative}
      LOCAL_STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: local
      # Verschluesselt die abgelegten Dateien. Ohne Schluessel liegen sie im
      # Klartext - deshalb steht hier `:?` und nicht `:-`: Ein vergessener
      # Eintrag soll den Start abbrechen und nicht stillschweigend den Schutz
      # weglassen. Erzeugen: docker compose run --rm api initiative-api
      # --generate-media-key
      MEDIA_KEY: ${MEDIA_KEY:?fehlt - siehe .env.beispiel}
      # Bei genau einem Prozess ist das die robustere Wahl – siehe die
      # Begründung in der docker-compose.yml im Wurzelverzeichnis.
      REALTIME_BUS: memory
      # Hier steht wirklich Caddy davor, und die API hat keinen eigenen Port
      # nach aussen. Nur dann darf X-Forwarded-For geglaubt werden - sonst
      # schreibt sich jeder Angreifer eine fremde Adresse hinein und sperrt
      # damit den aus, dem sie gehoert.
      TRUST_PROXY: "true"
      # Siehe .env: die eine Entscheidung, die sich nie mehr korrigieren laesst.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
    volumes:
      - uploads:/data/uploads

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-compufan}/initiative-web:${IMAGE_TAG:-live}
    restart: unless-stopped
    <<: [*logs, *haerten]
    # Liefert nur fertige Dateien auf Port 8080 aus.
    cap_drop:
      - ALL
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: [*logs, *haerten]
    cap_drop:
      - ALL
    cap_add:
      # Die einzige Ausnahme im ganzen Stapel: Ports unter 1024 zu belegen ist
      # ein Sonderrecht, und 80 und 443 sind nicht verhandelbar.
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?fehlt}
      ACME_EMAIL: ${ACME_EMAIL:?fehlt}
      # Siehe Caddyfile. Auf einem geliehenen Hostnamen klein halten (300),
      # auf der eigenen Domain weglassen.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Ohne dieses Volume holt Caddy nach jedem Neustart ein neues
      # Zertifikat – und läuft in die Ratenbremse von Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
  caddy-logs:
